<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sylvia Produces is a Nevada-based producer with major-tech operations experience.">
  <meta name="theme-color" content="#F7F2EA">
  <title>Sylvia Produces — Production & Operations</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top" data-page="home" data-base="">
  <header class="site-header" data-site-header></header>
  <main>
    <section class="hero">
      <div class="hero__copy reveal is-visible">
        <p class="eyebrow hero__eyebrow"><span aria-hidden="true">✦</span> Sylvia Produces · Nevada</p>
        <h1 aria-label="Production &amp; Operations with background in Tech"><span aria-hidden="true">Production &amp;</span><span aria-hidden="true">Operations with</span><span aria-hidden="true">background in Tech</span></h1>
        <p class="hero__subtitle">Hi, I'm Sylvia, a Nevada-based producer with major-tech operations experience</p>
      </div>
      <div class="hero__portrait-stack reveal is-visible">
        <div class="hero__art">
          <figure class="media-image"><img data-hero-image src="assets/images/sylvia.webp" alt="Portrait of Sylvia outdoors" width="1767" height="2048"></figure>
        </div>
      </div>
    </section>

    <section class="section" id="work">
      <div class="section-head section-head--portfolio reveal"><h2><span>01</span> Work / Case Study</h2></div>
      <div class="work-grid" data-case-grid>
        <noscript><p>Enable JavaScript to load case studies from the editable content studio.</p></noscript>
      </div>
    </section>

    <section class="section section--sky" id="writing">
      <div class="section-head section-head--portfolio reveal"><h2><span>02</span> Writing</h2></div>
      <div class="work-grid" data-post-grid></div>
    </section>

    <section class="section section--yellow" id="projects">
      <div class="section-head section-head--portfolio reveal"><h2><span>03</span> Projects in development</h2></div>
      <div class="work-grid" data-project-grid></div>
    </section>
  </main>
  <footer class="site-footer" data-site-footer></footer>
  <script type="module" src="main.js"></script>
</body>
</html>
